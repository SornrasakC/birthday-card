<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Image Proposal</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Prompt", sans-serif;
      background: #fff7f1;
      color: #352c31;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    h2 { margin: 26px 0 12px; font-size: 21px; letter-spacing: 0; }
    a { color: #c42766; font-weight: 700; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 14px;
    }
    .pill {
      border: 1px solid #ead8d0;
      border-radius: 999px;
      background: #fff;
      padding: 7px 11px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #ead8d0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(90, 50, 70, 0.1);
    }
    .card--skip { opacity: 0.82; }
    .preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f4e2db;
      overflow: hidden;
    }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .raw {
      width: 100%;
      height: 160px;
      object-fit: contain;
      display: block;
      background: #f8eee9;
      border-top: 1px solid #ead8d0;
    }
    .body { padding: 10px 12px 12px; font-size: 13px; line-height: 1.45; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .name { font-weight: 700; overflow-wrap: anywhere; }
    .badge {
      flex: none;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge--include { background: #ddf7e8; color: #14633a; }
    .badge--maybe { background: #fff3c4; color: #765500; }
    .badge--skip { background: #f1e4e2; color: #73423d; }
    code {
      color: #7b3150;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>New Image Proposal</h1>
    <nav>
      <a href="debug.html">Debug crops</a>
      &nbsp;·&nbsp;
      <a href="index.html">Card</a>
    </nav>
  </header>
  <div class="summary" id="summary"></div>
  <p class="pill">Updated rule: family photos are welcome when papa or mama is clearly visible. Skip remains mostly for duplicates, back-view photos, or unclear parent faces.</p>
  <main id="app"></main>

  <script>
    const proposals = [
      { file: "192616_0.jpg", status: "skip", target: "mom", focus: "center 48%", reason: "Duplicate of an image already in the mom batch." },
      { file: "192664_0.jpg", status: "include", target: "couple/family", focus: "center 58%", reason: "Both parents are present; crop favors the people over the tall ceiling." },
      { file: "192665_0.jpg", status: "include", target: "papa", focus: "center 50%", reason: "Papa is clear enough; crop keeps the head safe while reducing some ceiling." },
      { file: "192666_0.jpg", status: "include", target: "mom", focus: "center 58%", reason: "Good solo mom photo; crop keeps face higher while retaining body." },
      { file: "192666_1.jpg", status: "skip", target: "mom", focus: "center 52%", reason: "Duplicate of 192666_0.jpg." },
      { file: "192667_0.jpg", status: "include", target: "couple", focus: "44% center", reason: "Good pair photo with both parents visible in a nice setting." },
      { file: "192668_0.jpg", status: "include", target: "papa", focus: "center 46%", reason: "Fun papa moment with a clear enough face and body." },
      { file: "192669_0.jpg", status: "skip", target: "papa", focus: "center 48%", reason: "Papa is too small; the bridge dominates." },
      { file: "192670_0.jpg", status: "include", target: "couple/family", focus: "center 62%", reason: "Both parents are visible; crop reduces headroom and centers the group." },
      { file: "192671_0.jpg", status: "include", target: "couple", focus: "center 58%", reason: "Good family/couple moment; crop keeps faces balanced in the frame." },
      { file: "192672_0.jpg", status: "include", target: "mom/family", focus: "center center", reason: "Mom is clearly visible with daughters; good family-context mom image." },
      { file: "192673_0.jpg", status: "include", target: "mom", focus: "center 60%", reason: "Strong mom solo; crop raises her face and keeps maple color." },
      { file: "192674_0.jpg", status: "include", target: "mom", focus: "center 54%", reason: "Fun mom solo; crop avoids a low-face composition." },
      { file: "192675_0.jpg", status: "include", target: "mom", focus: "58% center", reason: "Good horizontal mom close-up with monkeys; clear smile." },
      { file: "192676_0.jpg", status: "skip", target: "mom", focus: "62% center", reason: "Very similar to 192675_0.jpg; 192675 is cleaner." },
      { file: "192677_0.jpg", status: "maybe", target: "mom/family", focus: "center center", reason: "Family pose with mom visible; optional because it is more children-focused." },
      { file: "192678_0.jpg", status: "include", target: "mom/family", focus: "center center", reason: "Mom is clear in a warm family meal setting." },
      { file: "192680_0.jpg", status: "maybe", target: "family", focus: "center center", reason: "Good family meal image; optional because parents are not centered." },
      { file: "192681_0.jpg", status: "include", target: "mom/family", focus: "center 58%", reason: "Mom is visible in a good family selfie; crop keeps faces away from the lower edge." },
      { file: "192682_0.jpg", status: "include", target: "mom", focus: "45% center", reason: "Good mom-and-monkey scene; face clear and composition works." },
      { file: "192683_0.jpg", status: "include", target: "mom", focus: "center 54%", reason: "Good solo mom portrait; crop balances face and scenery." },
      { file: "192684_0.jpg", status: "include", target: "mom/family", focus: "center center", reason: "Good close-up with mom and daughter; mom face is clear." },
      { file: "192685_0.jpg", status: "maybe", target: "mom/family", focus: "center 48%", reason: "Family trail photo with mom visible; optional because the frame is busy." },
      { file: "192686_0.jpg", status: "maybe", target: "mom/family", focus: "center 48%", reason: "Mom/family trail image; optional because faces are smaller." },
      { file: "192687_0.jpg", status: "include", target: "mom", focus: "center 40%", reason: "Good full-body mom photo; safer crop keeps the full head visible." },
      { file: "192688_0.jpg", status: "include", target: "mom", focus: "center 56%", reason: "Good seated mom photo; crop keeps face central with table context." },
      { file: "192689_0.jpg", status: "maybe", target: "mom", focus: "center 54%", reason: "Pretty autumn setting, but mom is relatively small." },
      { file: "192690_0.jpg", status: "include", target: "mom/family", focus: "center 58%", reason: "Mom and son photo with mom face clear; crop lifts both faces." },
      { file: "192691_0.jpg", status: "include", target: "mom", focus: "center 60%", reason: "Good travel photo; crop puts mom's face in a stronger position." },
      { file: "192692_0.jpg", status: "include", target: "mom", focus: "center 54%", reason: "Good mom restaurant photo; crop reduces low-face framing." },
      { file: "192694_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Parents are visible in a group holiday photo; suitable for couple/group batch." },
      { file: "192695_0.jpg", status: "include", target: "couple", focus: "44% center", reason: "Good pair image in the bamboo seating area." },
      { file: "192697_0.jpg", status: "include", target: "couple", focus: "center 50%", reason: "Both parents together; safer crop avoids cutting heads." },
      { file: "192698_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Family selfie with both parents visible; good for group/couple batch." },
      { file: "192699_0.jpg", status: "skip", target: "family", focus: "center 48%", reason: "Not relevant to papa/mom poem batches." },
      { file: "192700_0.jpg", status: "skip", target: "family", focus: "center 48%", reason: "Not focused on papa or mom." },
      { file: "192701_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Fun group sign photo with parents clear enough; good family-context batch image." },
      { file: "192702_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Good family cave selfie with both parents visible." },
      { file: "192703_0.jpg", status: "include", target: "papa/family", focus: "center center", reason: "Papa appears clearly enough with family context." },
      { file: "192704_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Group selfie with parents visible; suitable under the family-photo rule." },
      { file: "192705_0.jpg", status: "include", target: "papa", focus: "center 60%", reason: "Papa solo by sign; crop raises papa in the frame." },
      { file: "192706_0.jpg", status: "include", target: "couple", focus: "center center", reason: "Both parents visible with location sign; good couple/context photo." },
      { file: "192707_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Family selfie with parents visible; good group-context image." },
      { file: "192708_0.jpg", status: "include", target: "couple/family", focus: "center center", reason: "Good group sign photo with parents clear enough." },
      { file: "192709_0.jpg", status: "include", target: "papa/family", focus: "center 48%", reason: "Papa is clear; safer crop keeps his head fully visible." },
      { file: "192710_0.jpg", status: "include", target: "papa", focus: "center 58%", reason: "Good papa solo; crop gives a more balanced face/body frame." },
      { file: "192711_0.jpg", status: "skip", target: "papa", focus: "center center", reason: "Back-view scenic photo; no face." },
    ];

    const order = [
      ["include", "Recommended to Add"],
      ["maybe", "Optional / Maybe"],
      ["skip", "Skip"],
    ];

    function badge(status) {
      return status === "include" ? "Add" : status === "maybe" ? "Maybe" : "Skip";
    }

    const summary = document.getElementById("summary");
    order.forEach(([status, label]) => {
      const count = proposals.filter((item) => item.status === status).length;
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = `${label}: ${count}`;
      summary.appendChild(pill);
    });

    const app = document.getElementById("app");
    order.forEach(([status, title]) => {
      const items = proposals.filter((item) => item.status === status);
      const section = document.createElement("section");
      section.innerHTML = `<h2>${title} (${items.length})</h2><div class="grid"></div>`;
      const grid = section.querySelector(".grid");
      items.forEach((item) => {
        const src = `assets/new2/${item.file}`;
        const card = document.createElement("article");
        card.className = `card card--${item.status}`;
        card.innerHTML = `
          <div class="preview">
            <img alt="" src="${src}" style="object-position: ${item.focus}" />
          </div>
          <img class="raw" alt="" src="${src}" />
          <div class="body">
            <div class="topline">
              <span class="name">${item.file}</span>
              <span class="badge badge--${item.status}">${badge(item.status)}</span>
            </div>
            <div><strong>target</strong>: <code>${item.target}</code></div>
            <div><strong>crop</strong>: <code>${item.focus}</code></div>
            <div><strong>note</strong>: ${item.reason}</div>
          </div>
        `;
        grid.appendChild(card);
      });
      app.appendChild(section);
    });
  </script>
</body>
</html>

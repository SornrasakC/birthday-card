<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Image Proposal</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Prompt", sans-serif;
      background: #fff7f1;
      color: #352c31;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    h2 { margin: 26px 0 12px; font-size: 21px; letter-spacing: 0; }
    a { color: #c42766; font-weight: 700; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 14px;
    }
    .pill {
      border: 1px solid #ead8d0;
      border-radius: 999px;
      background: #fff;
      padding: 7px 11px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #ead8d0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(90, 50, 70, 0.1);
    }
    .card--skip { opacity: 0.82; }
    .preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f4e2db;
      overflow: hidden;
    }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .raw {
      width: 100%;
      height: 160px;
      object-fit: contain;
      display: block;
      background: #f8eee9;
      border-top: 1px solid #ead8d0;
    }
    .body { padding: 10px 12px 12px; font-size: 13px; line-height: 1.45; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .name { font-weight: 700; overflow-wrap: anywhere; }
    .badge {
      flex: none;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge--include { background: #ddf7e8; color: #14633a; }
    .badge--maybe { background: #fff3c4; color: #765500; }
    .badge--skip { background: #f1e4e2; color: #73423d; }
    code {
      color: #7b3150;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>New Image Proposal</h1>
    <nav>
      <a href="debug.html">Debug crops</a>
      &nbsp;·&nbsp;
      <a href="index.html">Card</a>
    </nav>
  </header>
  <div class="summary" id="summary"></div>
  <main id="app"></main>

  <script>
    const proposals = [
      { file: "192616_0.jpg", status: "skip", target: "mom", focus: "center 48%", reason: "Duplicate of an image already in the mom batch." },
      { file: "192664_0.jpg", status: "maybe", target: "couple", focus: "center 48%", reason: "Both parents are present, but faces are small; okay as a contextual couple photo." },
      { file: "192665_0.jpg", status: "maybe", target: "papa", focus: "center 52%", reason: "Papa is clear but small in the frame; useful if you want more location variety." },
      { file: "192666_0.jpg", status: "include", target: "mom", focus: "center 52%", reason: "Good solo mom photo, bright color, clear face." },
      { file: "192666_1.jpg", status: "skip", target: "mom", focus: "center 52%", reason: "Duplicate of 192666_0.jpg." },
      { file: "192667_0.jpg", status: "include", target: "couple", focus: "44% center", reason: "Good pair photo with both parents visible in a nice setting." },
      { file: "192668_0.jpg", status: "maybe", target: "papa", focus: "center 46%", reason: "Fun papa moment, but the face is a bit small." },
      { file: "192669_0.jpg", status: "skip", target: "papa", focus: "center 48%", reason: "Papa is too small; the bridge dominates." },
      { file: "192670_0.jpg", status: "maybe", target: "couple", focus: "center 52%", reason: "Both parents are visible, but the pose is formal and faces are small." },
      { file: "192671_0.jpg", status: "include", target: "couple", focus: "center 48%", reason: "Good family/couple moment; parents are centered and smiling." },
      { file: "192672_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Nice selfie, but not focused on papa/mom for the poem batches." },
      { file: "192673_0.jpg", status: "include", target: "mom", focus: "center 52%", reason: "Strong mom solo with vivid maple background." },
      { file: "192674_0.jpg", status: "include", target: "mom", focus: "center 48%", reason: "Fun mom solo; face is expressive and clear." },
      { file: "192675_0.jpg", status: "include", target: "mom", focus: "58% center", reason: "Good horizontal mom close-up with monkeys; clear smile." },
      { file: "192676_0.jpg", status: "skip", target: "mom", focus: "62% center", reason: "Very similar to 192675_0.jpg; 192675 is cleaner." },
      { file: "192677_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Nice group pose, but not papa/mom focused." },
      { file: "192678_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Group meal photo; parents are not the focus." },
      { file: "192680_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Group meal photo; not suitable for papa/mom poem batches." },
      { file: "192681_0.jpg", status: "skip", target: "family", focus: "center 50%", reason: "Group selfie; not focused enough on parents." },
      { file: "192682_0.jpg", status: "include", target: "mom", focus: "45% center", reason: "Good mom-and-monkey scene; face clear and composition works." },
      { file: "192683_0.jpg", status: "include", target: "mom", focus: "center 46%", reason: "Good solo mom portrait with scenery." },
      { file: "192684_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Good close-up but includes daughter; not a poem-batch fit." },
      { file: "192685_0.jpg", status: "skip", target: "family", focus: "center 48%", reason: "Group trail photo; parents are not clear enough." },
      { file: "192686_0.jpg", status: "skip", target: "family", focus: "center 48%", reason: "Group trail photo; not focused on papa/mom." },
      { file: "192687_0.jpg", status: "include", target: "mom", focus: "center 50%", reason: "Good full-body mom photo in garden setting." },
      { file: "192688_0.jpg", status: "include", target: "mom", focus: "center 48%", reason: "Good seated mom photo; crop can keep face and table context." },
      { file: "192689_0.jpg", status: "maybe", target: "mom", focus: "center 54%", reason: "Pretty autumn setting, but mom is relatively small." },
      { file: "192690_0.jpg", status: "skip", target: "family", focus: "center 46%", reason: "Two-person photo not focused on papa/mom as a pair." },
      { file: "192691_0.jpg", status: "include", target: "mom", focus: "center 52%", reason: "Good travel photo; face is clear enough and background adds variety." },
      { file: "192692_0.jpg", status: "include", target: "mom", focus: "center 44%", reason: "Good mom restaurant photo; clear face and different setting." },
      { file: "192694_0.jpg", status: "maybe", target: "couple", focus: "center center", reason: "Family/couple holiday photo; usable if you want group context." },
      { file: "192695_0.jpg", status: "include", target: "couple", focus: "44% center", reason: "Good pair image in the bamboo seating area." },
      { file: "192697_0.jpg", status: "include", target: "couple", focus: "center 54%", reason: "Both parents together; good vertical couple option." },
      { file: "192698_0.jpg", status: "maybe", target: "couple", focus: "center center", reason: "Parents are visible but selfie composition is dominated by others." },
      { file: "192699_0.jpg", status: "skip", target: "family", focus: "center 48%", reason: "Not relevant to papa/mom poem batches." },
      { file: "192700_0.jpg", status: "skip", target: "family", focus: "center 48%", reason: "Not focused on papa or mom." },
      { file: "192701_0.jpg", status: "maybe", target: "family", focus: "center center", reason: "Fun group sign photo, but not a clean papa/mom batch image." },
      { file: "192702_0.jpg", status: "maybe", target: "family", focus: "center center", reason: "Good family cave selfie; optional if adding family-context images." },
      { file: "192703_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Papa appears, but selfie composition is not clean for the poem." },
      { file: "192704_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Group selfie; not focused enough." },
      { file: "192705_0.jpg", status: "include", target: "papa", focus: "center 52%", reason: "Papa solo by sign; good extra papa travel photo." },
      { file: "192706_0.jpg", status: "include", target: "couple", focus: "center center", reason: "Both parents visible with location sign; good couple/context photo." },
      { file: "192707_0.jpg", status: "skip", target: "family", focus: "center center", reason: "Family selfie; not a clean papa/mom/couple crop." },
      { file: "192708_0.jpg", status: "maybe", target: "family", focus: "center center", reason: "Good group sign photo, but family-focused rather than poem-focused." },
      { file: "192709_0.jpg", status: "maybe", target: "papa", focus: "center 52%", reason: "Papa is clear, but other people in the background compete." },
      { file: "192710_0.jpg", status: "include", target: "papa", focus: "center 48%", reason: "Good papa solo, clear face and body." },
      { file: "192711_0.jpg", status: "skip", target: "papa", focus: "center center", reason: "Back-view scenic photo; no face." },
    ];

    const order = [
      ["include", "Recommended to Add"],
      ["maybe", "Optional / Maybe"],
      ["skip", "Skip"],
    ];

    function badge(status) {
      return status === "include" ? "Add" : status === "maybe" ? "Maybe" : "Skip";
    }

    const summary = document.getElementById("summary");
    order.forEach(([status, label]) => {
      const count = proposals.filter((item) => item.status === status).length;
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = `${label}: ${count}`;
      summary.appendChild(pill);
    });

    const app = document.getElementById("app");
    order.forEach(([status, title]) => {
      const items = proposals.filter((item) => item.status === status);
      const section = document.createElement("section");
      section.innerHTML = `<h2>${title} (${items.length})</h2><div class="grid"></div>`;
      const grid = section.querySelector(".grid");
      items.forEach((item) => {
        const src = `assets/new2/${item.file}`;
        const card = document.createElement("article");
        card.className = `card card--${item.status}`;
        card.innerHTML = `
          <div class="preview">
            <img alt="" src="${src}" style="object-position: ${item.focus}" />
          </div>
          <img class="raw" alt="" src="${src}" />
          <div class="body">
            <div class="topline">
              <span class="name">${item.file}</span>
              <span class="badge badge--${item.status}">${badge(item.status)}</span>
            </div>
            <div><strong>target</strong>: <code>${item.target}</code></div>
            <div><strong>crop</strong>: <code>${item.focus}</code></div>
            <div><strong>note</strong>: ${item.reason}</div>
          </div>
        `;
        grid.appendChild(card);
      });
      app.appendChild(section);
    });
  </script>
</body>
</html>
